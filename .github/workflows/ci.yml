name: ci
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Offline tests (no key, no network models)
        env: {PYTHONPATH: src, EMBEDDER: lsa, HAYSTACK_TELEMETRY_ENABLED: "False"}
        run: python -m pytest tests -q

  # The first REAL run of the Neo4j + GDS code (written without a server) and of Qdrant in server mode.
  services:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        ports: ["7687:7687"]
        env:
          NEO4J_AUTH: neo4j/ci-only-password
          NEO4J_PLUGINS: '["graph-data-science"]'
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-password 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Live Neo4j + GDS and Qdrant server tests
        env:
          PYTHONPATH: src
          EMBEDDER: lsa
          HAYSTACK_TELEMETRY_ENABLED: "False"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-only-password
          QDRANT_URL: http://localhost:6333
        run: python -m pytest tests/test_graph_live.py tests/test_qdrant_live.py -q
