# Everything on your laptop: the app, a Qdrant server and a Neo4j server with the Graph Data Science plugin.
#   docker compose up --build            then open http://localhost:7860
# Add ANTHROPIC_API_KEY=... to a .env file next to this one to run with Claude instead of the offline stand-ins.
# The passwords below are for local use only. Never reuse them anywhere that is reachable from the internet.
services:
  app:
    build: .
    ports: ["7860:7860"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: rag-local-only
      MAX_LIVE_QUESTIONS: "15"
    depends_on:
      qdrant: {condition: service_started}
      neo4j: {condition: service_healthy}

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  neo4j:
    image: neo4j:5.26-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/rag-local-only
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "rag-local-only", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  qdrant_data:
  neo4j_data:
